<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Hogar Pixel Art - Coni & Nacho</title>
  <style>
    :root {
      --bg-cream: #fbf7ee;
      --card-bg: #fffdf9;
      --border-color: #5c4033;
      --lavender: #c8b6db;
      --blue-sofa: #44648c;
      --text-dark: #3a2e2b;
      --accent-pink: #f28b82;
      --accent-green: #81c784;
      --accent-gold: #f4b400;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-cream);
      font-family: 'Courier New', Courier, monospace;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
    }

    .main-container {
      display: flex;
      flex-direction: row;
      gap: 16px;
      max-width: 1140px;
      width: 100%;
      background: #faf4e8;
      border: 4px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 6px 6px 0px rgba(92, 64, 51, 0.4);
    }

    @media (max-width: 860px) {
      .main-container {
        flex-direction: column;
      }
    }

    .game-section {
      flex: 1.5;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .room-selector {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .room-btn {
      background: #eadaaf;
      border: 2px solid var(--border-color);
      padding: 6px 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: 2px 2px 0px var(--border-color);
      transition: all 0.1s;
    }

    .room-btn:hover {
      background: #dfcb9b;
    }

    .room-btn.active {
      background: #f7a072;
      color: #fff;
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--border-color);
    }

    .canvas-container {
      position: relative;
      border: 4px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      box-shadow: 4px 4px 0px rgba(92, 64, 51, 0.3);
      aspect-ratio: 16 / 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .banner-notification {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid var(--border-color);
      padding: 6px 14px;
      font-weight: bold;
      font-size: 13px;
      border-radius: 20px;
      color: #b71c1c;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.25);
      display: none;
      z-index: 10;
      text-align: center;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      0% { transform: translateX(-50%) scale(0.7); opacity: 0; }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }

      display: grid;
