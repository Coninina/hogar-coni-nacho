<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nuestro Hogar - Coni & Nacho</title>
  <style>
    :root {
      --bg-cream: #f4ecdc;
      --card-bg: #fffdf8;
      --border-dark: #4a332d;
      --accent-pink: #f28b82;
      --accent-purple: #b39ddb;
      --accent-orange: #ffb74d;
      --font-pixel: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-cream);
      font-family: var(--font-pixel);
      color: var(--border-dark);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 10px;
    }

    .main-wrapper {
      display: flex;
      flex-direction: row;
      gap: 14px;
      max-width: 1000px;
      width: 100%;
      background: #fbf6ec;
      border: 3.5px solid var(--border-dark);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 4px 5px 0px rgba(74, 51, 45, 0.4);
    }

    @media (max-width: 820px) {
      .main-wrapper {
        flex-direction: column;
        padding: 8px;
        gap: 10px;
      }
    }

    .game-col {
      flex: 1.6;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 2.5px solid var(--border-dark);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: bold;
    }

    .room-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .room-tabs::-webkit-scrollbar { display: none; }

    .room-btn {
      flex: 0 0 auto;
      background: #faebd7;
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      color: var(--border-dark);
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-dark);
      transition: all 0.1s ease;
    }

    .room-btn.active {
      background: #f7a072;
      color: #fff;
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--border-dark);
    }

    /* Contenedor responsivo perfecto */
    .viewport-box {
      width: 100%;
      position: relative;
      border: 3.5px solid var(--border-dark);
      border-radius: 12px;
      overflow: hidden;
      background: #fdf5ea;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.06);
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .toast-msg {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.96);
      border: 2.5px solid var(--border-dark);
      padding: 6px 14px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 20px;
      color: #b71c1c;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
      display: none;
      z-index: 10;
      white-space: nowrap;
    }

    /* Barras de amor y felicidad */
    .status-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--card-bg);
      border: 2.5px solid var(--border-dark);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .status-card {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 10.5px;
      font-weight: bold;
    }

    .status-header {
      display: flex;
      justify-content: space-between;
    }

    .progress-bar-bg {
      height: 12px;
      background: #e2d9cd;
      border: 2px solid var(--border-dark);
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 80%;
      background: linear-gradient(90deg, #f48fb1, #e57373);
      transition: width 0.3s ease;
    }
    .progress-bar-fill.purple { background: linear-gradient(90deg, #b39ddb, #9575cd); }
    .progress-bar-fill.orange { background: linear-gradient(90deg, #ffcc80, #ffa726); }

    /* Botones de interacción */
    .controls-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .control-btn {
      background: #fff;
      border: 2.5px solid var(--border-dark);
      border-radius: 10px;
      padding: 8px 4px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      color: var(--border-dark);
      cursor: pointer;
      box-shadow: 2.5px 2.5px 0px var(--border-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.1s;
    }

    .control-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0.5px 0.5px 0px var(--border-dark);
    }

    /* Sección de Diario y Pensamientos */
    .diary-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 2.5px solid var(--border-dark);
      border-radius: 10px;
      padding: 10px;
      min-width: 250px;
      max-height: 540px;
    }

    .diary-title {
      font-weight: bold;
      font-size: 13px;
      padding-bottom: 6px;
      border-bottom: 2px dashed #d0c0b0;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .diary-feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      padding-right: 2px;
    }

    .feed-card {
      background: #faf6f0;
      border: 1.5px solid #ded0be;
      border-left: 4.5px solid #8d6e63;
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 11px;
      line-height: 1.35;
      animation: appear 0.3s ease;
    }
    .feed-card.coni { border-left-color: #9575cd; }
    .feed-card.nacho { border-left-color: #e57373; }
    .feed-card.together { border-left-color: #4db6ac; }

    .feed-time {
      font-size: 9.5px;
      color: #888;
      font-weight: bold;
      margin-bottom: 2px;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Modal Cocina */
    .modal-wrap {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 14px;
    }

    .modal-box {
      background: #fffdf8;
      border: 3.5px solid var(--border-dark);
      border-radius: 14px;
      width: 100%;
      max-width: 360px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 4px 5px 0px rgba(0,0,0,0.3);
    }

    .food-opt {
      background: #fff;
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
    }
    .food-opt:hover { background: #ffe0b2; }
  </style>
</head>
<body>

<div class="main-wrapper">
  <!-- COLUMNA JUEGO -->
  <div class="game-col">
    <div class="top-header">
      <div>🏡 Nuestro Hogar</div>
      <div id="clock-display">Santiago: --:--:--</div>
    </div>

    <!-- SELECTOR DE SALAS -->
    <div class="room-tabs">
      <button class="room-btn active" id="btn-salon" onclick="changeRoom('salon')">🛋️ Salón</button>
      <button class="room-btn" id="btn-cocina" onclick="changeRoom('cocina')">🍳 Cocina</button>
      <button class="room-btn" id="btn-dormitorio" onclick="changeRoom('dormitorio')">🛏️ Dormitorio</button>
      <button class="room-btn" id="btn-terraza" onclick="changeRoom('terraza')">🌿 Terraza</button>
      <button class="room-btn" id="btn-sala_nacho" onclick="changeRoom('sala_nacho')">🎮 Sala Nacho</button>
      <button class="room-btn" id="btn-sala_coni" onclick="changeRoom('sala_coni')">📚 Sala Coni</button>
    </div>

    <!-- LIENZO PIXEL ART -->
    <div class="viewport-box">
      <div id="toast" class="toast-msg"></div>
      <canvas id="stage" width="560" height="350"></canvas>
    </div>

    <!-- BARRAS DE ESTADO -->
    <div class="status-panel">
      <div class="status-card">
        <div class="status-header"><span>Nacho 💕</span><span id="txt-nacho">80%</span></div>
        <div class="progress-bar-bg"><div id="bar-nacho" class="progress-bar-fill" style="width: 80%;"></div></div>
      </div>
      <div class="status-card">
        <div class="status-header"><span>Coni 💜</span><span id="txt-coni">80%</span></div>
        <div class="progress-bar-bg"><div id="bar-coni" class="progress-bar-fill purple" style="width: 80%;"></div></div>
      </div>
      <div class="status-card">
        <div class="status-header"><span>Mochi 🐾</span><span id="txt-mochi">80%</span></div>
        <div class="progress-bar-bg"><div id="bar-mochi" class="progress-bar-fill orange" style="width: 80%;"></div></div>
      </div>
    </div>

    <!-- BOTONES -->
    <div class="controls-panel">
      <button class="control-btn" onclick="openKitchenModal()">
        <span style="font-size: 18px;">🍲</span>
        <span>Cocinar</span>
      </button>
      <button class="control-btn" onclick="hugAction()">
        <span style="font-size: 18px;">🫂</span>
        <span>Abrazo</span>
      </button>
      <button class="control-btn" onclick="petAction()">
        <span style="font-size: 18px;">🐱</span>
        <span>Acariciar</span>
      </button>
    </div>
  </div>

  <!-- COLUMNA DIARIO -->
  <div class="diary-col">
    <div class="diary-title">
      <span>Diario & Sentimientos</span>
      <span style="font-size: 10px; color:#888;">En Vivo</span>
    </div>
    <div class="diary-feed" id="diary-feed"></div>
  </div>
</div>

<!-- MODAL COCINAR -->
<div class="modal-wrap" id="kitchenModal" onclick="closeKitchenModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3 style="font-size: 13px; text-align: center;">🍳 ¿Qué preparará Coni con amor?</h3>
    <button class="food-opt" onclick="cook('Pastel de Choclo')">🌽 Pastel de Choclo recién horneado</button>
    <button class="food-opt" onclick="cook('Panqueques')">🥞 Panqueques con manjar</button>
    <button class="food-opt" onclick="cook('Crema de espárragos')">🥣 Crema de espárragos fresca</button>
    <button class="food-opt" onclick="cook('Asado de Cordero al Palo')">🍖 Asado de Cordero al Palo</button>
    <button class="room-btn" style="margin-top: 4px;" onclick="closeKitchenModal()">Cerrar</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  let activeRoom = 'salon';
  let toastTimer = null;
  let heartParticles = [];

  // Datos guardados
  let gameData = {
    nacho: 80,
    coni: 80,
    mochi: 80,
    lastHug: Date.now(),
    lastPet: Date.now(),
    cooked: null
  };

  try {
    const s = localStorage.getItem('coni_nacho_save_v2');
    if (s) Object.assign(gameData, JSON.parse(s));
  } catch(e) {}

  function save() {
    try { localStorage.setItem('coni_nacho_save_v2', JSON.stringify(gameData)); } catch(e) {}
  }

  function getSantiagoTime() {
    try {
      const s = new Date().toLocaleString("en-US", { timeZone: "America/Santiago" });
      return new Date(s);
    } catch(e) { return new Date(); }
  }

  function checkDecay() {
    const now = Date.now();
    // 1% cada 30 min sin abrazo
    const minHug = (now - gameData.lastHug) / (1000 * 60);
    if (minHug >= 30) {
      const st = Math.floor(minHug / 30);
      gameData.nacho = Math.max(0, gameData.nacho - st * 1);
      gameData.coni = Math.max(0, gameData.coni - st * 1);
      gameData.lastHug += st * 30 * 60 * 1000;
    }
    // 10% cada 2h (120 min) sin acariciar
    const minPet = (now - gameData.lastPet) / (1000 * 60);
    if (minPet >= 120) {
      const st = Math.floor(minPet / 120);
      gameData.mochi = Math.max(0, gameData.mochi - st * 10);
      gameData.lastPet += st * 120 * 60 * 1000;
    }
    updateBars();
    save();
  }

  function updateBars() {
    document.getElementById('bar-nacho').style.width = gameData.nacho + '%';
    document.getElementById('txt-nacho').innerText = Math.round(gameData.nacho) + '%';
    document.getElementById('bar-coni').style.width = gameData.coni + '%';
    document.getElementById('txt-coni').innerText = Math.round(gameData.coni) + '%';
    document.getElementById('bar-mochi').style.width = gameData.mochi + '%';
    document.getElementById('txt-mochi').innerText = Math.round(gameData.mochi) + '%';
  }

  function notify(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.display = 'none'; }, 4200);
  }

  function hugAction() {
    gameData.lastHug = Date.now();
    gameData.nacho = Math.min(100, gameData.nacho + 12.5);
    gameData.coni = Math.min(100, gameData.coni + 12.5);
    addHearts(canvas.width / 2, canvas.height / 2 - 10, 10);
    logDiary('together', 'Abrazo reconfortante', 'Coni y Nacho se dan un tierno y cálido abrazo en casa.');

    if (gameData.nacho >= 100 && gameData.coni >= 100) {
      notify("¡Coni y Nacho disfrutan de su amor! 💕");
    }
    updateBars();
    save();
  }

  function petAction() {
    gameData.lastPet = Date.now();
    gameData.mochi = Math.min(100, gameData.mochi + 20);
    addHearts(240, 260, 8);
    logDiary('together', 'Mimos para Mochi', 'Acariciaste a Mochi en su lomo. ¡Ronronea feliz!');

    if (gameData.mochi >= 100) {
      notify("Haces muy feliz a Mochi, él ronronea en tu regazo 🐾");
    }
    updateBars();
    save();
  }

  function openKitchenModal() { document.getElementById('kitchenModal').style.display = 'flex'; }
  function closeKitchenModal() { document.getElementById('kitchenModal').style.display = 'none'; }

  function cook(dish) {
    closeKitchenModal();
    gameData.cooked = dish;
    changeRoom('cocina');
    addHearts(canvas.width / 2, canvas.height / 2, 8);

    let tip = "";
    if (dish === 'Pastel de Choclo') tip = "Doradito al horno con mucho cariño.";
    else if (dish === 'Panqueques') tip = "Con manjar dulce para consentir a Nacho.";
    else if (dish === 'Crema de espárragos') tip = "Nutritiva y calientita.";
    else tip = "¡Un manjar tradicional!";

    logDiary('coni', 'Coni cocinó ' + dish, `Coni preparó ${dish}. ${tip}`);
    logDiary('nacho', 'Nacho disfruta la comida', `Nacho ha comido ${dish} hecho por Coni después del trabajo, está muy rico, se siente afortunado de tener a Coni en su vida 💕`);
    notify(`🍳 Coni cocinó con amor: ${dish}`);
    save();
  }

  const SCHEDULE_THOUGHTS = {
    morning: {
      coni: [
        "Regaloneando con Mochi en la cama, ¡aún no es tiempo de salir! 🛌",
        "Pensando en si hacer panqueques o huevos revueltos, quizá algo dulce para Nacho.",
        "Iré a atender a Mochi, le estaba faltando que rellenaran su plato de comida."
      ],
      nacho: [
        "Mejor sigo durmiendo zzzzzz...",
        "Oh, tuve un sueño de lo más raro, creo que lo escribiré en mi diario.",
        "Anoche sí que me dormí tarde, ¡espero tener mejores horarios de sueño!"
      ],
      together: [
        "Duermen acurrucados en la cama con Mochi.",
        "Nacho abraza a Coni en la cama y se pega a ella para seguir durmiendo sintiendo su olor.",
        "Coni le hace cariño en el pelo a Nacho suavemente a ver si despierta.",
        "Mochi ronronea plácidamente, no sabe si es su primera o séptima siesta del día."
      ]
    },
    midday: {
      coni: [
        "Continuaré trabajando en mi novela, ¡tengo mucha inspiración hoy!",
        "Es temporada de espárragos, quizá deba hacer una crema, ¡el hierro es bueno!",
        "Creo que saldré a pasear para inspirarme y anotar ideas en mi cuaderno.",
        "¿Qué hará el Nacho hoy? Me pregunto si querrá salir al parque."
      ],
      nacho: [
        "Voy a salir un rato con mis amigos a tocar en la plaza, el día está bonito.",
        "Definitivamente la polera gris con estos pantalones, ¡no por nada es mi favorita!",
        "Pondré a lavar la ropa ahora, ¿o espero a que se junte más?",
        "¿A qué jugaré hoy en la noche? Hay un juego con el que estoy obsesionado…"
      ],
      together: [
        "Coni y Nacho disfrutan sentados en la terraza, Coni le lee mientras Nacho reposa en sus muslos.",
        "Momento tranquilo en casa: Coni lee un libro y Nacho practica con su viola."
      ]
    },
    lunch: {
      coni: [
        "También hice algo para ti Mochi 🐱",
        "Me gustó lo que preparé hoy, quizá lo haga más seguido.",
        "Dejé un poco en la olla por si quieres comer más, Nachito."
      ],
      nacho: [
        "Me encanta almorzar con Coni, todo sabe más dulce y rico cuando comemos juntos.",
        "¿Qué sabor es este? Quizá tiene un toque de sal extra, pero delicioso.",
        "¡Ahora sí quedé lleno, estuvo muy rico!"
      ],
      together: [
        "Nacho y Coni disfrutan del almuerzo compartiendo historias del día."
      ]
    },
    games: {
      coni: [
        "¡Qué buena jugada! Vamos a ver quién adivina la pista en Dixit.",
        "Me encanta cuando vienen amigos a la casa a jugar."
      ],
      nacho: [
        "¡Es hora de una tarde divertida de juegos de mesa con amigos! ¿Dixit? ¿Monopoly? ¿Tough Calls? ¿Hanabi?",
        "¡Ojo con esa carta, juguemos cooperativo!"
      ],
      together: [
        "¡Tarde de juegos de mesa en el salón! Risas y fichas en movimiento."
      ]
    },
    evening: {
      coni: [
        "Hoy voy a empezar un nuevo capítulo sobre las vicisitudes familiares.",
        "Creo que me falta inspiración, lo dejaré a un lado y lo discutiré luego con Gemini.",
        "Ahhh… eso está mejor, creo que voy más rápido de lo que pensaba.",
        "Oh, tengo otra idea, debo anotarla de inmediato."
      ],
      nacho: [
        "AAAAAAAY QUE RABIA POR LA CHUCHAAAAAA ME MATÓ DE NUEVOOOO",
        "MONO CULIADO MUÉVETEEEEE",
        "Ooooh me encanta esta parte, hace tiempo que no me pasaba este jefe."
      ],
      together: [
        "Nacho en su rincón gamer y Coni escribiendo entre libros y buena música."
      ]
    },
    night: {
      coni: ["Buenas noches mundo... la camita está tan calentita.", "Mochi ya se acurrucó a nuestros pies..."],
      nacho: ["Dormir abrazado a Coni es lo mejor de todo el día.", "Zzzzzzz..."],
      together: ["Los dos durmiendo plácidamente en el dormitorio con Mochi, luces suaves y calma."]
    }
  };

  function getScheduleKey(hour) {
    if (hour >= 7 && hour < 11) return 'morning';
    if (hour >= 11 && hour < 14) return 'midday';
    if (hour >= 14 && hour < 15) return 'lunch';
    if (hour >= 15 && hour < 18) return 'games';
    if (hour >= 18 && hour < 22) return 'evening';
    return 'night';
  }

  function logDiary(author, title, text) {
    const box = document.getElementById('diary-feed');
    if (!box) return;
    const card = document.createElement('div');
    card.className = `feed-card ${author}`;

    const stgo = getSantiagoTime();
    const time = stgo.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });

    let tag = "Coni & Nacho";
    if (author === 'coni') tag = "Coni 💜";
    if (author === 'nacho') tag = "Nacho 💕";

    card.innerHTML = `<div class="feed-time">${time} • ${tag} — <i>${title}</i></div><div>${text}</div>`;
    box.prepend(card);
    while (box.children.length > 25) box.removeChild(box.lastChild);
  }

  setInterval(() => {
    const stgo = getSantiagoTime();
    const bundle = SCHEDULE_THOUGHTS[getScheduleKey(stgo.getHours())];
    const rnd = Math.random();
    if (rnd < 0.35) {
      const m = bundle.coni[Math.floor(Math.random() * bundle.coni.length)];
      logDiary('coni', 'Pensamiento de Coni', m);
    } else if (rnd < 0.7) {
      const m = bundle.nacho[Math.floor(Math.random() * bundle.nacho.length)];
      logDiary('nacho', 'Pensamiento de Nacho', m);
    } else {
      const m = bundle.together[Math.floor(Math.random() * bundle.together.length)];
      logDiary('together', 'Momento en casa', m);
    }
  }, 30000);

  function changeRoom(r) {
    activeRoom = r;
    document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('btn-' + r);
    if (btn) btn.classList.add('active');
  }

  function addHearts(x, y, count = 8) {
    for (let i = 0; i < count; i++) {
      heartParticles.push({
        x: x + (Math.random() * 30 - 15),
        y: y + (Math.random() * 20 - 10),
        vx: (Math.random() - 0.5) * 1.4,
        vy: -Math.random() * 1.5 - 0.6,
        life: 1.0,
        decay: 0.02 + Math.random() * 0.02,
        color: Math.random() > 0.5 ? '#f48fb1' : '#ce93d8'
      });
    }
  }

  function updateParticles() {
    for (let i = heartParticles.length - 1; i >= 0; i--) {
      const p = heartParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) { heartParticles.splice(i, 1); continue; }

      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 4, 4);
      ctx.fillRect(Math.floor(p.x - 2), Math.floor(p.y - 2), 4, 3);
      ctx.fillRect(Math.floor(p.x + 2), Math.floor(p.y - 2), 4, 3);
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y + 3), 2, 2);
      ctx.restore();
    }
  }

  function px(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
  }

    px(400, 142, 40, 20, "#37474f");
    px(404, 133, 32, 11, "#fffdf9");

    // Frasco de tinta y pluma
    px(455, 151, 10, 12, "#000000");
    px(458, 148, 5, 3, "#ffb74d");
    px(464, 133, 3, 20, "#fff9c4");
    px(462, 129, 6, 7, "#b0bec5");

    drawConi(385, 140, false, true);
    drawMochi(228, 255, false);
  }

  function loop() {
    const stgo = getSantiagoTime();
    const h = stgo.getHours();
    const m = stgo.getMinutes();
    const s = stgo.getSeconds();

    const pad = n => String(n).padStart(2, '0');
    const clk = document.getElementById('clock-display');
    if (clk) clk.innerText = `Santiago: ${pad(h)}:${pad(m)}:${pad(s)}`;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    renderEnvironment(h, m);
    updateParticles();
    checkDecay();

    requestAnimationFrame(loop);
  }

  // Inicialización
  (function init() {
    updateBars();
    logDiary('together', 'Hogar en Santiago', 'Coni y Nacho disfrutan de un cálido y adorable momento en su hogar.');
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
