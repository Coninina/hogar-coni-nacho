<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Hogar - Coni & Nacho</title>
  <style>
    :root {
      --bg-cream: #fbf7ee;
      --card-bg: #fffdf9;
      --border-color: #5c4033;
      --lavender: #c8b6db;
      --text-dark: #3a2e2b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-cream);
      font-family: 'Courier New', Courier, monospace;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
    }

    .main-container {
      display: flex;
      flex-direction: row;
      gap: 16px;
      max-width: 1140px;
      width: 100%;
      background: #faf4e8;
      border: 4px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 6px 6px 0px rgba(92, 64, 51, 0.4);
    }

    @media (max-width: 860px) {
      .main-container {
        flex-direction: column;
      }
    }

    .game-section {
      flex: 1.5;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .room-selector {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .room-btn {
      background: #eadaaf;
      border: 2px solid var(--border-color);
      padding: 6px 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: 2px 2px 0px var(--border-color);
      transition: all 0.1s;
    }

    .room-btn:hover {
      background: #dfcb9b;
    }

    .room-btn.active {
      background: #f7a072;
      color: #fff;
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--border-color);
    }

    .canvas-container {
      position: relative;
      border: 4px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background: #fbf7ee;
      box-shadow: 4px 4px 0px rgba(92, 64, 51, 0.3);
      aspect-ratio: 16 / 10;
      min-height: 320px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .banner-notification {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid var(--border-color);
      padding: 6px 14px;
      font-weight: bold;
      font-size: 13px;
      border-radius: 20px;
      color: #b71c1c;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.25);
      display: none;
      z-index: 10;
      text-align: center;
    }

    .status-bars-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
    }

    .bar-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      font-weight: bold;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
    }

    .progress-track {
      height: 14px;
      background: #ddd;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 80%;
      background: linear-gradient(90deg, #f28b82, #ff6b6b);
      transition: width 0.3s ease;
    }

    .progress-fill.coni {
      background: linear-gradient(90deg, #b39ddb, #9575cd);
    }

    .progress-fill.mochi {
      background: linear-gradient(90deg, #ffb74d, #ffa726);
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .act-btn {
      background: #fff;
      border: 3px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .act-btn:hover { background: #fdf5e6; }
    .act-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--border-color); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-content {
      background: #fffdf9;
      border: 4px solid var(--border-color);
      padding: 18px;
      border-radius: 12px;
      width: 90%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .food-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .food-btn {
      background: #fff;
      border: 2px solid var(--border-color);
      padding: 10px;
      border-radius: 6px;
      font-family: inherit;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
    }

    .food-btn:hover { background: #ffe0b2; }

    .diary-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      min-width: 290px;
      max-height: 600px;
    }

    .diary-header {
      font-weight: bold;
      font-size: 14px;
      padding-bottom: 8px;
      border-bottom: 2px dashed var(--border-color);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .diary-logs {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      flex: 1;
    }

    .diary-entry {
      background: #fff;
      border: 2px solid #dfcfb9;
      border-left: 5px solid #8e6e53;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.4;
    }

    .diary-entry.coni { border-left-color: #9575cd; }
    .diary-entry.nacho { border-left-color: #e57373; }
    .diary-entry.together { border-left-color: #4db6ac; }

    .diary-time {
      font-size: 10px;
      color: #888;
      margin-bottom: 3px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="main-container">
  <div class="game-section">
    <div class="header-bar">
      <div>🏡 Nuestro Hogar</div>
      <div id="stgo-clock">Santiago: --:--:--</div>
    </div>

    <div class="room-selector">
      <button class="room-btn active" id="btn-salon" onclick="switchRoom('salon')">🛋️ Salón</button>
      <button class="room-btn" id="btn-cocina" onclick="switchRoom('cocina')">🍳 Cocina</button>
      <button class="room-btn" id="btn-dormitorio" onclick="switchRoom('dormitorio')">🛏️ Dormitorio</button>
      <button class="room-btn" id="btn-terraza" onclick="switchRoom('terraza')">🌿 Terraza / Jardín</button>
      <button class="room-btn" id="btn-sala_nacho" onclick="switchRoom('sala_nacho')">🎮 Sala de Nacho</button>
      <button class="room-btn" id="btn-sala_coni" onclick="switchRoom('sala_coni')">📚 Sala de Coni</button>
    </div>

    <div class="canvas-container">
      <div id="banner-notification" class="banner-notification"></div>
      <canvas id="gameCanvas" width="640" height="400"></canvas>
    </div>

    <div class="status-bars-container">
      <div class="bar-box">
        <div class="bar-label"><span>Nacho 💕</span><span id="pct-nacho">80%</span></div>
        <div class="progress-track"><div id="bar-nacho" class="progress-fill" style="width: 80%;"></div></div>
      </div>
      <div class="bar-box">
        <div class="bar-label"><span>Coni 💜</span><span id="pct-coni">80%</span></div>
        <div class="progress-track"><div id="bar-coni" class="progress-fill coni" style="width: 80%;"></div></div>
      </div>
      <div class="bar-box">
        <div class="bar-label"><span>Mochi 🐾</span><span id="pct-mochi">80%</span></div>
        <div class="progress-track"><div id="bar-mochi" class="progress-fill mochi" style="width: 80%;"></div></div>
      </div>
    </div>

    <div class="actions-grid">
      <button class="act-btn" onclick="openCookMenu()">
        <span style="font-size: 20px;">🍲</span>
        <span>Cocinar Comida</span>
      </button>
      <button class="act-btn" onclick="actionHug()">
        <span style="font-size: 20px;">🫂</span>
        <span>Abrazo de Amor</span>
      </button>
      <button class="act-btn" onclick="actionPetMochi()">
        <span style="font-size: 20px;">🐱</span>
        <span>Acariciar Mascota</span>
      </button>
    </div>
  </div>

  <div class="diary-section">
    <div class="diary-header">
      <span>Diario & Sentimientos</span>
      <span style="font-size: 11px; opacity: 0.8;">En Vivo</span>
    </div>
    <div class="diary-logs" id="diary-logs"></div>
  </div>
</div>

<div class="modal-overlay" id="cookModal" onclick="closeCookMenu(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3 style="text-align:center;">🍳 ¿Qué preparará Coni con amor?</h3>
    <div class="food-options">
      <button class="food-btn" onclick="cookDish('Pastel de Choclo')">🌽 Pastel de Choclo recién horneado</button>
      <button class="food-btn" onclick="cookDish('Panqueques')">🥞 Panqueques con manjar</button>
      <button class="food-btn" onclick="cookDish('Crema de espárragos')">🥣 Crema de espárragos de temporada</button>
      <button class="food-btn" onclick="cookDish('Asado de Cordero al Palo')">🍖 Asado de Cordero al Palo</button>
    </div>
    <button class="room-btn" style="margin-top: 6px;" onclick="closeCookMenu()">Cerrar</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  let currentRoom = 'salon';
  let bannerTimer = null;
  let particles = [];

  let state = {
    nachoLove: 80,
    coniLove: 80,
    mochiHappy: 80,
    lastHugTime: Date.now(),
    lastPetTime: Date.now(),
    currentDish: null
  };

  try {
    const saved = localStorage.getItem('adorable_home_stgo_save');
    if (saved) {
      Object.assign(state, JSON.parse(saved));
    }
  } catch (e) {}

  function saveGame() {
    try {
      localStorage.setItem('adorable_home_stgo_save', JSON.stringify(state));
    } catch (e) {}
  }

  function getSantiagoDate() {
    try {
      const santiagoStr = new Date().toLocaleString("en-US", { timeZone: "America/Santiago" });
      return new Date(santiagoStr);
    } catch (e) {
      return new Date();
    }
  }

  function updateDecay() {
    const now = Date.now();
    const minSinceHug = (now - state.lastHugTime) / (1000 * 60);
    if (minSinceHug >= 30) {
      const steps = Math.floor(minSinceHug / 30);
      state.nachoLove = Math.max(0, state.nachoLove - steps * 1);
      state.coniLove = Math.max(0, state.coniLove - steps * 1);
      state.lastHugTime += steps * 30 * 60 * 1000;
    }

    const minSincePet = (now - state.lastPetTime) / (1000 * 60);
    if (minSincePet >= 120) {
      const steps = Math.floor(minSincePet / 120);
      state.mochiHappy = Math.max(0, state.mochiHappy - steps * 10);
      state.lastPetTime += steps * 120 * 60 * 1000;
    }

    updateUIBars();
    saveGame();
  }

  function updateUIBars() {
    document.getElementById('bar-nacho').style.width = Math.min(100, Math.max(0, state.nachoLove)) + '%';
    document.getElementById('pct-nacho').innerText = Math.round(state.nachoLove) + '%';
    document.getElementById('bar-coni').style.width = Math.min(100, Math.max(0, state.coniLove)) + '%';
    document.getElementById('pct-coni').innerText = Math.round(state.coniLove) + '%';
    document.getElementById('bar-mochi').style.width = Math.min(100, Math.max(0, state.mochiHappy)) + '%';
    document.getElementById('pct-mochi').innerText = Math.round(state.mochiHappy) + '%';
  }

  function showBanner(text) {
    const el = document.getElementById('banner-notification');
    el.innerText = text;
    el.style.display = 'block';
    if (bannerTimer) clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => { el.style.display = 'none'; }, 4500);
  }

  function actionHug() {
    state.lastHugTime = Date.now();
    state.nachoLove = Math.min(100, state.nachoLove + 12.5);
    state.coniLove = Math.min(100, state.coniLove + 12.5);
    spawnHearts(canvas.width / 2, canvas.height / 2, 12);
    addDiaryEntry("together", "Abrazo reconfortante", "Coni y Nacho se dan un tierno y cálido abrazo en casa.");

    if (state.nachoLove >= 100 && state.coniLove >= 100) {
      showBanner("¡Coni y Nacho disfrutan de su amor! 💕");
    }
    updateUIBars();
    saveGame();
  }

  function actionPetMochi() {
    state.lastPetTime = Date.now();
    state.mochiHappy = Math.min(100, state.mochiHappy + 20);
    spawnHearts(260, 280, 8);
    addDiaryEntry("together", "Mimos para Mochi", "Acariciaste a Mochi suavemente detrás de las orejitas.");

    if (state.mochiHappy >= 100) {
      showBanner("Haces muy feliz a Mochi, él ronronea en tu regazo 🐾");
    }
    updateUIBars();
    saveGame();
  }

  function openCookMenu() { document.getElementById('cookModal').style.display = 'flex'; }
  function closeCookMenu() { document.getElementById('cookModal').style.display = 'none'; }

  function cookDish(dishName) {
    closeCookMenu();
    state.currentDish = dishName;
    switchRoom('cocina');
    spawnHearts(canvas.width / 2, canvas.height / 2 - 20, 10);

    let comment = "¡Qué delicia casera!";
    if (dishName === "Pastel de Choclo") comment = "¡Qué delicia típica y doradita al horno!";
    else if (dishName === "Panqueques") comment = "Preparados con harto manjar para endulzar el día de Nacho.";
    else if (dishName === "Crema de espárragos") comment = "Calientita y llena de hierro para cuidar el cuerpo.";
    else if (dishName === "Asado de Cordero al Palo") comment = "¡Un manjar tradicional digno de celebración!";

    addDiaryEntry("coni", "Coni cocinó " + dishName, `Coni ha preparado ${dishName}. ${comment}`);
    addDiaryEntry("nacho", "Nacho disfruta la comida", `Nacho ha comido ${dishName} hecho por Coni después del trabajo, está muy rico, se siente afortunado de tener a Coni en su vida 💕`);
    showBanner(`🍳 Coni cocinó con amor: ${dishName}`);
    saveGame();
  }

  const DIARY_SCHEDULE = {
    morning: {
      coni: [
        "Regaloneando con Mochi en la cama, ¡aún no es tiempo de salir! 🛌",
        "Pensando en si hacer panqueques o huevos revueltos, quizá algo dulce para Nacho.",
        "Iré a atender a Mochi, le estaba faltando que rellenaran su plato de comida."
      ],
      nacho: [
        "Mejor sigo durmiendo zzzzzz...",
        "Oh, tuve un sueño de lo más raro, creo que lo escribiré en mi diario.",
        "Anoche sí que me dormí tarde, ¡espero tener mejores horarios de sueño de ahora en adelante!"
      ],
      together: [
        "Duermen acurrucados en la cama con Mochi.",
        "Nacho abraza a Coni en la cama y se pega a ella para seguir durmiendo mientras siente su olor.",
        "Coni le hace cariño en el pelo a Nacho suavemente a ver si se despierta, sin mucho éxito.",
        "Mochi ronronea plácidamente, definitivamente no sabe qué hora es ni si esta es su primera o séptima siesta del día."
      ]
    },
    midday: {
      coni: [
        "Continuaré trabajando en mi novela, ¡tengo mucha inspiración y debería anotar estas ideas cuanto antes!",
        "Es temporada de espárragos, quizá deba hacer una crema, ¡el hierro es bueno para el cuerpo!",
        "Creo que saldré a pasear, nada como una buena caminata para inspirarme, ¡también debería traer un cuaderno para anotar mis ideas!",
        "¿Qué hará el Nacho hoy? Me pregunto si querrá salir conmigo al parque."
      ],
      nacho: [
        "Voy a salir un rato con mis amigos a tocar en la plaza, el día está muy bonito.",
        "¿Qué polera debería ponerme? Definitivamente la polera gris con estos pantalones, sip, ¡no por nada es mi polera favorita!",
        "Pondré a lavar la ropa ahora, ¿o quizá deba esperar a que se junte más?",
        "¿A qué jugaré hoy en la noche? Ah, ya sé, hay un juego con el que he estado obsesionado últimamente…"
      ],
      together: [
        "Coni y Nacho disfrutan del día sentados en la terraza, Coni le lee a Nacho en voz alta la continuación del libro mientras Nacho la escucha con ojos cerrados.",
        "Es momento de estar en casa, Coni lee un libro mientras Nacho practica con su viola una nueva canción en el salón. Es un día relajado."
      ]
    },
    lunch: {
      coni: [
        "También hice algo para ti Mochi 🐱",
        "Me gustó lo que preparé hoy, quizá lo haga más seguido.",
        "Dejé un poco en la olla por si quieres comer más, Nachito."
      ],
      nacho: [
        "Me encanta almorzar con Coni, por alguna razón siento que todo sabe mejor y más dulce cuando comemos juntos.",
        "¿Qué sabor es este? Quizá esto tiene demasiada sal... pero sigue rico.",
        "¡Ahora sí quedé lleno, estuvo muy rico!"
      ],
      together: [
        "Nacho y Coni disfrutan del almuerzo juntos compartiendo charlas cotidianas en la cocina."
      ]
    },
    games: {
      coni: [
        "¡Qué buena jugada! Vamos a ver quién adivina la siguiente pista en Dixit.",
        "Me encanta cuando vienen amigos a la casa a pasar la tarde."
      ],
      nacho: [
        "¡Ojo con esa carta! La estrategia aquí es cooperativa, no nos confiemos.",
        "¡Es hora de una tarde divertida de juegos de mesa con amigos! ¿Dixit? ¿Monopoly? ¿Tough Calls? ¿Hanabi? ¿Qué juego será el que habrán elegido nuestros queridos invitados hoy?"
      ],
      together: [
        "¡Tarde de juegos de mesa en el salón! Risas, cartas y dados volando entre amigos."
      ]
    },
    evening: {
      coni: [
        "Hoy voy a empezar un nuevo capítulo, será sobre las vicisitudes de la vida familiar… ¿o sobre la aparición de un nuevo personaje clave en la historia?",
        "Creo que me falta inspiración, no me gusta lo que escribí, pero lo dejaré a un lado y lo discutiré luego con Gemini.",
        "Ahhh… eso está mejor, creo que voy progresando más rápido de lo que pensaba.",
        "Oh, tengo otra idea, debo anotarla para iniciarla una vez que haya terminado con esto."
      ],
      nacho: [
        "AAAAAAAY QUE RABIA POR LA CHUCHAAAAAA ME MATÓ DE NUEVOOOO",
        "MONO CULIADO MUÉVETEEEEE",
        "Ooooh me encanta esta parte, hace tiempo que no me pasaba este jefe."
      ],
      together: [
        "Nacho inmerso en su rincón gamer y Coni concentrada en su novela entre libros y vinilos."
      ]
    },
    night: {
      coni: [
        "Buenas noches mundo... la cama está tan calentita.",
        "Mochi ya se acurrucó a nuestros pies..."
      ],
      nacho: [
        "Dormir abrazado a Coni es lo mejor de todo el día.",
        "Zzzzzzz..."
      ],
      together: [
        "Los dos durmiendo plácidamente en el dormitorio con Mochi, luces apagadas en la habitación y sueños tranquilos."
      ]
    }
  };

  function getCurrentScheduleKey(hour) {
    if (hour >= 7 && hour < 11) return 'morning';
    if (hour >= 11 && hour < 14) return 'midday';
    if (hour >= 14 && hour < 15) return 'lunch';
    if (hour >= 15 && hour < 18) return 'games';
    if (hour >= 18 && hour < 22) return 'evening';
    return 'night';
  }

  function addDiaryEntry(author, title, text) {
    const logs = document.getElementById('diary-logs');
    if (!logs) return;
    const entry = document.createElement('div');
    entry.className = `diary-entry ${author}`;

    const stgoNow = getSantiagoDate();
    const timeStr = stgoNow.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });

    let authorTag = "Coni & Nacho";
    if (author === 'coni') authorTag = "Coni 💜";
    if (author === 'nacho') authorTag = "Nacho 💕";

    entry.innerHTML = `
      <div class="diary-time">${timeStr} • ${authorTag} - <i>${title}</i></div>
      <div>${text}</div>
    `;

    logs.prepend(entry);
    while (logs.children.length > 25) {
      logs.removeChild(logs.lastChild);
    }
  }

  function triggerScheduledThought() {
    const stgo = getSantiagoDate();
    const hour = stgo.getHours();
    const key = getCurrentScheduleKey(hour);
    const bundle = DIARY_SCHEDULE[key];

    const pick = Math.random();
    if (pick < 0.35) {
      const msg = bundle.coni[Math.floor(Math.random() * bundle.coni.length)];
      addDiaryEntry('coni', 'Pensamiento de Coni', msg);
    } else if (pick < 0.70) {
      const msg = bundle.nacho[Math.floor(Math.random() * bundle.nacho.length)];
      addDiaryEntry('nacho', 'Pensamiento de Nacho', msg);
    } else {
      const msg = bundle.together[Math.floor(Math.random() * bundle.together.length)];
      addDiaryEntry('together', 'Momento compartido', msg);
    }
  }

  setInterval(triggerScheduledThought, 32000);

  function switchRoom(room) {
    currentRoom = room;
    document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('btn-' + room);
    if (btn) btn.classList.add('active');
  }

  function spawnHearts(x, y, count = 8) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x + (Math.random() * 40 - 20),
        y: y + (Math.random() * 20 - 10),
        vx: (Math.random() - 0.5) * 1.5,
        vy: -Math.random() * 1.5 - 0.8,
        life: 1.0,
        decay: 0.015 + Math.random() * 0.015,
        color: Math.random() > 0.5 ? '#f48fb1' : '#ce93d8'
      });
    }
  }

  function renderParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 4, 4);
      ctx.fillRect(Math.floor(p.x - 2), Math.floor(p.y - 2), 4, 3);
      ctx.fillRect(Math.floor(p.x + 2), Math.floor(p.y - 2), 4, 3);
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y + 3), 2, 2);
      ctx.restore();
    }
  }

  function drawPixelRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
  }

    drawPixelRect(555, 270, 14, 50, "#65421d");

    drawPixelRect(375, 140, 60, 42, "#cfd8dc");
    drawPixelRect(380, 144, 50, 32, "#37474f");
    drawPixelRect(398, 182, 14, 8, "#90a4ae");

    drawPixelRect(460, 165, 45, 22, "#37474f");
    drawPixelRect(465, 155, 35, 12, "#fffdf9");
    drawPixelRect(468, 158, 28, 2, "#555");
    drawPixelRect(468, 162, 24, 2, "#555");

    drawPixelRect(520, 175, 12, 14, "#000000");
    drawPixelRect(523, 171, 6, 4, "#ffb74d");

    drawPixelRect(528, 150, 7, 8, "#b0bec5");

    drawConi(440, 160, false, true);
    drawMochi(260, 290, false);
  }

  function gameLoop() {
    const stgoNow = getSantiagoDate();
    const hours = stgoNow.getHours();
    const minutes = stgoNow.getMinutes();
    const seconds = stgoNow.getSeconds();

    const pad = (n) => String(n).padStart(2, '0');
    const clockEl = document.getElementById('stgo-clock');
    if (clockEl) {
      clockEl.innerText = `Santiago: ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    renderRoom(hours, minutes);
    renderParticles();
    applyDayNightLighting(hours);
    updateDecay();

    requestAnimationFrame(gameLoop);
  }

  function applyDayNightLighting(hour) {
    ctx.save();
    if (hour >= 20 || hour < 7) {
      ctx.fillStyle = "rgba(10, 20, 50, 0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    } else if (hour >= 18 && hour < 20) {
      ctx.fillStyle = "rgba(255, 110, 60, 0.06)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.restore();
  }

  (function init() {
    const stgo = getSantiagoDate();
    const h = stgo.getHours();
    if (h >= 22 || h < 7) {
      currentRoom = 'dormitorio';
    }
    document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
    const initialBtn = document.getElementById('btn-' + currentRoom);
    if (initialBtn) initialBtn.classList.add('active');

    updateUIBars();
    addDiaryEntry("together", "Hogar en Santiago", "Coni y Nacho disfrutan de un momento tranquilo en su hogar.");
    requestAnimationFrame(gameLoop);
  })();
</script>
</body>
</html>
